<div class="container mt-5" style="max-width: 400px;">
  <div class="card shadow p-4">
    <h3 class="text-center mb-4">Login</h3>

    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <form (ngSubmit)="onLogin()">
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" [(ngModel)]="credentials.email" name="email"
          placeholder="name@example.com" required />
        <label for="email">Email address</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password" [(ngModel)]="credentials.password" name="password"
          placeholder="Password" required />
        <label for="password">Password</label>
      </div>

      <button type="submit" class="w-100 btn btn-primary btn-lg" [disabled]="isLoading">
        {{ isLoading ? 'Signing In...' : 'Sign In' }}
      </button>

      <div class="text-center mt-3">
        <span class="text-muted">Don't have an account? </span>
        <a [routerLink]="'/register'">Register</a>
      </div>
    </form>
  </div>
</div>
